<section class="login-page">
  <div class="login-card">
    <header class="brand-block">
      <img class="brand-logo" src="/assets/BioGest.svg" alt="BIOGEST" />
      <p>{{ 'adminLogin.subtitle' | translate }}</p>
    </header>

    <article class="panel">
      <header class="panel-header">
        <h2>{{ 'adminLogin.title' | translate }}</h2>
        <p>{{ 'adminLogin.description' | translate }}</p>
      </header>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">
        <label class="field-label" for="login-email">{{ 'adminLogin.email' | translate }}</label>
        <div class="field-shell">
          <mat-icon>alternate_email</mat-icon>
          <input
            id="login-email"
            type="email"
            formControlName="email"
            autocomplete="username"
            [placeholder]="'adminLogin.emailPlaceholder' | translate"
          />
        </div>

        <div class="field-label-row">
          <label class="field-label" for="login-password">{{ 'adminLogin.password' | translate }}</label>
          <button type="button" class="text-link" [disabled]="true">
            {{ 'adminLogin.forgot' | translate }}
          </button>
        </div>

        <div class="field-shell">
          <mat-icon>lock</mat-icon>
          <input
            id="login-password"
            [type]="passwordVisible() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            [placeholder]="'adminLogin.passwordPlaceholder' | translate"
          />
          <button
            type="button"
            class="eye-toggle"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="'adminLogin.togglePassword' | translate"
          >
            <mat-icon>{{ passwordVisible() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>

        @if (errorMessage()) {
          <p class="error-message">{{ errorMessage() }}</p>
        }

        <button class="submit-btn" type="submit" [disabled]="loading()">
          @if (loading()) {
            <mat-spinner diameter="18"></mat-spinner>
          } @else {
            <span>{{ 'adminLogin.submit' | translate }}</span>
            <mat-icon>arrow_forward</mat-icon>
          }
        </button>
      </form>

      <footer class="panel-footer">
        <p>{{ 'adminLogin.restricted' | translate }}</p>
      </footer>
    </article>
  </div>
</section>
